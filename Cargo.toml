[package]
name = "termpaper"
version = "0.1.0"
edition = "2021"
description = "Wallpaper Engine for the terminal — GPU-rendered real-world scenes, synced across every monitor"
readme = "README.md"
license = "MIT"
keywords = ["terminal", "tui", "animation", "wallpaper", "screensaver"]
categories = ["command-line-utilities"]
repository = "https://github.com/Aphrodine-wq/termpaper"
homepage = "https://github.com/Aphrodine-wq/termpaper"
authors = ["aphrodine"]
include = ["src/**/*", "build.rs", "LICENSE", "README.md", "Cargo.lock"]

[[bin]]
name = "termpaper"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
crossterm = "0.29.0"
rand = "0.10.2"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
toml = "1.1.3"
# GPU backend: Studio shader scenes plus post-processing. On by default;
# `--no-default-features` builds the CPU-only binary (Classic scenes only).
# wgpu loads libvulkan at runtime, so a machine without a GPU still runs.
# `std` makes error scopes thread-local, which the shader compile thread needs.
wgpu = { version = "30.0.0", optional = true, default-features = false, features = ["std", "vulkan", "wgsl"] }
bytemuck = { version = "1.25", optional = true, features = ["derive"] }
pollster = { version = "1.0", optional = true }

[dev-dependencies]
naga = { version = "30.0.0", features = ["wgsl-in"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[features]
default = ["gpu"]
gpu = ["dep:wgpu", "dep:bytemuck", "dep:pollster"]

# These link the GPU backend, so they only exist in a `gpu` build.
[[example]]
name = "gpu_bench"
required-features = ["gpu"]

[[example]]
name = "gpu_diag"
required-features = ["gpu"]

[[example]]
name = "world_review"
required-features = ["gpu"]

[[example]]
name = "shader_review"
required-features = ["gpu"]

# naga validates every Studio shader in the test suite; unoptimized it
# dominates `cargo test` time.
[profile.dev.package.naga]
opt-level = 3

[profile.dev.package.wgpu-core]
opt-level = 2
