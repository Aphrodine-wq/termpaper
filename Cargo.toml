[package]
name = "termpaper"
version = "0.1.0"
edition = "2021"
description = "Wallpaper Engine for the terminal — 120fps truecolor worlds, 22 filters, total customization"
readme = "README.md"
license = "MIT"
keywords = ["terminal", "tui", "animation", "wallpaper", "screensaver"]
categories = ["command-line-utilities"]
repository = "https://github.com/Aphrodine-wq/termpaper"
homepage = "https://github.com/Aphrodine-wq/termpaper"
authors = ["aphrodine"]
include = ["src/**/*", "LICENSE", "README.md", "Cargo.lock"]

[[bin]]
name = "termpaper"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
crossterm = "0.29.0"
rand = "0.10.2"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.3"
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# GPU post-processing backend (optional). Off by default so the plain
# terminal build keeps its zero-driver dependency footprint.
wgpu = { version = "30.0.0", optional = true, default-features = false, features = ["vulkan", "wgsl"] }
bytemuck = { version = "1.25", optional = true, features = ["derive"] }
pollster = { version = "1.0", optional = true }

[features]
default = []
gpu = ["dep:wgpu", "dep:bytemuck", "dep:pollster"]

# These link the GPU backend, so they only exist in a `--features gpu` build.
[[example]]
name = "gpu_bench"
required-features = ["gpu"]

[[example]]
name = "gpu_diag"
required-features = ["gpu"]
