[package]
name = "termpaper"
version = "0.1.0"
edition = "2021"
description = "Wallpaper Engine for the terminal — animated truecolor scenes"
readme = "README.md"
license = "MIT"
keywords = ["terminal", "tui", "animation", "wallpaper", "screensaver"]
categories = ["command-line-utilities"]
repository = "https://github.com/Aphrodine-wq/termpaper"
homepage = "https://github.com/Aphrodine-wq/termpaper"
authors = ["aphrodine"]
include = ["src/**/*", "marketplace/**/*", "build.rs", "LICENSE", "README.md", "Cargo.lock"]

[build-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.3"

[[bin]]
name = "termpaper"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
crossterm = "0.29.0"
rand = "0.10.2"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.3"
serde_json = "1.0.140"
ureq = { version = "3.0.12", default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
