name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # CPU-only build (Classic scenes), then the default GPU build. Studio
      # shaders are validated with naga in both; rendering needs a real GPU
      # (`cargo test --test gpu_shader_scenes -- --ignored` locally).
      - run: cargo test --all-targets --no-default-features --locked
      - run: cargo test --all-targets --locked
      - run: cargo build --release --locked
